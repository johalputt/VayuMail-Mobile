name: CI
on: [push, pull_request]

jobs:
  constitution:
    name: Constitution compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'
      - name: Constitution gate (v1.1, all rules)
        run: sh scripts/constitution.sh

  supplychain:
    name: Supply-chain scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'
      # govulncheck loads every package, including the Gio UI, which binds
      # to system windowing libraries — install them so package loading
      # succeeds and the whole tree is scanned.
      - name: Install Gio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libxfixes-dev libvulkan-dev
      - name: govulncheck (known vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'

      # Gio's Linux backend needs system windowing headers; the engine
      # itself is pure Go (verified in the constitution job).
      - name: Install Gio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libxfixes-dev libvulkan-dev

      - name: Format check
        run: |
          files=$(gofmt -l .)
          [ -z "$files" ] || (echo "Unformatted: $files" && exit 1)

      - name: Vet
        run: go vet ./...

      # Runs before the slower checks: a lint failure should not cost a full
      # race build to discover. Note that golangci-lint stops analysing a
      # package the moment it fails to typecheck, so a single compile error
      # can hide every other finding in that package — do not read a short
      # report as a clean one while `typecheck` is among the issues.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          golangci-lint run ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: gosec (high severity, high confidence)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          gosec -severity high -confidence high -quiet ./...

      # A go.mod that does not match its imports means the dependency set a
      # reviewer reads is not the one that gets built.
      - name: go.mod is tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result:"
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi
          rm go.mod.bak go.sum.bak

      - name: Test (race, deterministic)
        run: go test -race -count=1 -timeout=180s ./...

      - name: Fuzz smoke (parser hardening)
        run: |
          go test -run=NONE -fuzz=FuzzMIMEParse -fuzztime=15s ./test/
          go test -run=NONE -fuzz=FuzzHTMLToText -fuzztime=10s ./test/

      - name: Build all binaries
        run: go build -trimpath ./cmd/...

      - name: Binary size budget
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o vayumail-cli-size ./cmd/vayumail-cli
          size=$(stat -c%s vayumail-cli-size)
          echo "engine binary: $((size / 1024 / 1024)) MiB ($size bytes)"
          # Lightness pillar: the headless engine stays under 40 MiB.
          [ "$size" -lt 41943040 ] || (echo "SIZE BUDGET EXCEEDED" && exit 1)

  crosscompile:
    name: Android cross-compile (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'
      # The engine is pure Go (constitution Rule 1) and the ship target is
      # Android, but nothing until now compiled it FOR Android — every gate ran
      # against host linux/amd64. This is the cheapest way to catch the class of
      # bug that only appears on a phone: a 32-bit `int`, an unaligned 64-bit
      # atomic on armv7, a host-only syscall or /proc path.
      #
      # internal/biometric and internal/pushnotify are excluded because they are
      # the JNI seams — on GOOS=android they select their cgo files by design.
      # ui/state is excluded for the same reason: it depends on them.
      - name: Build the engine for every Android ABI
        run: |
          PKGS=$(go list ./internal/... | grep -vE 'internal/(biometric|pushnotify)$')
          echo "$PKGS" | sed 's/^/  /'
          for arch in arm64 arm amd64; do
            echo "== android/$arch =="
            CGO_ENABLED=0 GOOS=android GOARCH=$arch go build $PKGS
          done
      - name: Build the operator binaries for arm64
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build \
            ./cmd/vayumail-cli ./cmd/vayumail-provision

      # The manifest hardening lives in a patch against gogio's compiled-in
      # template (audit L12). Running it here means a gogio release that rewords
      # that template breaks CI on the next push, rather than breaking the next
      # attempt to cut a version — or, worse, applying to nothing and shipping an
      # APK with Android backup enabled.
      - name: The gogio manifest patch still applies
        run: |
          sh scripts/gogio-hardened.sh ./gogio-hardened
          # Prove every hardening reached the built tool, not just that the
          # script exited 0.
          strings ./gogio-hardened | grep -q 'android:allowBackup="false"' \
            || (echo "patched gogio does not carry allowBackup=false" && exit 1)
          for perm in FOREGROUND_SERVICE DATA_SYNC POST_NOTIFICATIONS USE_BIOMETRIC; do
            strings ./gogio-hardened | grep -q "android.permission.$perm" \
              || (echo "patched gogio does not inject $perm" && exit 1)
          done
          strings ./gogio-hardened | grep -q 'org.vayu.mail.VayuSyncService' \
            || (echo "patched gogio does not declare VayuSyncService" && exit 1)
          echo "manifest patches verified in the built tool"

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # The standing instructions have named markdownlint a pre-push gate for a long time while
      # CI never ran it, so "passing" was undefined and drifted. The ruleset
      # lives in .markdownlint-cli2.jsonc with the reasoning for each rule that
      # is off.
      - name: markdownlint
        run: npx --yes markdownlint-cli2

  coverage:
    name: Engine coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'
      - name: Coverage on engine packages
        run: |
          go test -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./test/
          go tool cover -func=coverage.out | tail -1
      # This job printed a number and uploaded a file for its whole life, which
      # means it could not fail and therefore measured nothing. The floor is set
      # just under the figure at the time it was introduced: it exists to stop
      # coverage sliding backwards unnoticed, not to be a target. Raise it when
      # the real number moves up — never lower it to make a build green.
      - name: Coverage floor
        run: |
          FLOOR=58.0
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "engine coverage: ${pct}% (floor ${FLOOR}%)"
          awk -v p="$pct" -v f="$FLOOR" 'BEGIN { exit !(p+0 >= f+0) }' || {
            echo "COVERAGE BELOW FLOOR: ${pct}% < ${FLOOR}%"
            go tool cover -func=coverage.out | sort -k3 -n | head -20
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
